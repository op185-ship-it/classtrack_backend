spring.application.name=classtrack_backend_start

#database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/class_track_db
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=Admin@123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── Flask ML service URL ───────────────────────────────────────────────────────
flask.service.url=${FLASK_SERVICE_URL:http://localhost:5000}

# ── Multipart file upload limits ──────────────────────────────────────────────
# Group photos and student images can be large; raise limits accordingly.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-swallow-size=-1

server.address=0.0.0.0
